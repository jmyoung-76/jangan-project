<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>벽돌깨기</title>
  <style>
    /* 화면 중앙 배치 */
    body {
      margin: 0;
      display: grid;
      place-items: center;
      height: 100vh;
      background: #f3f3f3;
      font-family: Arial, sans-serif;
    }

    /* 캔버스 스타일 */
    canvas {
      display: block;
      background: #fff;
      border: 4px solid #222;
    }

    /* 설명 문구 */
    .info {
      margin-top: 10px;
      text-align: center;
      font-size: 16px;
      font-weight: bold;
      color: #333;
    }
  </style>
</head>
<body>
  <div>
    <canvas id="game" width="480" height="640"></canvas>
    <div class="info">← → 이동 / 화면 클릭으로 시작</div>
  </div>

  <script>
    // 캔버스와 2D 그래픽 도구를 연결
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');

    // 게임 상태 변수
    let running = false; // 게임이 진행 중인지 여부
    let score = 0;       // 점수
    let lives = 3;       // 남은 목숨
    let keys = { left: false, right: false }; // 키 입력 상태

    // 패들(공을 막는 막대기)
    const paddle = {
      x: 185,
      y: 600,
      w: 110,
      h: 14,
      speed: 7
    };

    // 공 객체
    const ball = {
      x: 240,
      y: 420,
      r: 8,
      vx: 4,
      vy: -4
    };

    // 벽돌 배열
    const bricks = [];

    // 벽돌을 처음 만들거나 다시 만드는 함수
    function makeBricks() {
      bricks.length = 0;

      for (let row = 0; row < 5; row++) {
        for (let col = 0; col < 8; col++) {
          bricks.push({
            x: 20 + col * 55,
            y: 40 + row * 26,
            w: 45,
            h: 18,
            live: true
          });
        }
      }
    }

    // 공 위치를 패들 위로 다시 초기화하는 함수
    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - ball.r - 2;
      ball.vx = (Math.random() < 0.5 ? -1 : 1) * 4;
      ball.vy = -4;
    }

    // 게임 로직을 갱신하는 함수
    function update() {
      if (!running) return;

      // 패들 이동
      if (keys.left) paddle.x -= paddle.speed;
      if (keys.right) paddle.x += paddle.speed;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, paddle.x));

      // 공 이동
      ball.x += ball.vx;
      ball.y += ball.vy;

      // 벽과 충돌 처리
      if (ball.x - ball.r < 0 || ball.x + ball.r > canvas.width) {
        ball.vx *= -1;
      }

      if (ball.y - ball.r < 0) {
        ball.vy *= -1;
      }

      // 바닥을 지나가면 목숨 감소
      if (ball.y + ball.r > canvas.height) {
        lives -= 1;

        if (lives <= 0) {
          alert('게임 오버!');
          score = 0;
          lives = 3;
          makeBricks();
          resetBall();
          running = false;
          return;
        }

        resetBall();
        return;
      }

      // 패들과 충돌 처리
      if (
        ball.x > paddle.x &&
        ball.x < paddle.x + paddle.w &&
        ball.y + ball.r > paddle.y &&
        ball.y < paddle.y + paddle.h
      ) {
        ball.vy = -Math.abs(ball.vy);
        ball.vx += (ball.x - (paddle.x + paddle.w / 2)) * 0.08;
      }

      // 벽돌과 충돌 처리
      for (const brick of bricks) {
        if (!brick.live) continue;

        if (
          ball.x > brick.x &&
          ball.x < brick.x + brick.w &&
          ball.y > brick.y &&
          ball.y < brick.y + brick.h
        ) {
          brick.live = false;
          ball.vy *= -1;
          score += 1;

          if (score === bricks.length) {
            alert('승리!');
            score = 0;
            makeBricks();
            resetBall();
            running = false;
          }
          break;
        }
      }
    }

    // 화면을 그리는 함수
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 패들 그리기
      ctx.fillStyle = '#333';
      ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

      // 공 그리기
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fillStyle = '#e74c3c';
      ctx.fill();

      // 벽돌 그리기
      for (const brick of bricks) {
        if (!brick.live) continue;
        ctx.fillStyle = '#4ecdc4';
        ctx.fillRect(brick.x, brick.y, brick.w, brick.h);
      }

      // 점수와 목숨 표시
      ctx.fillStyle = '#222';
      ctx.font = '20px sans-serif';
      ctx.fillText('점수: ' + score, 18, 28);
      ctx.fillText('생명: ' + lives, 390, 28);

      // 게임이 멈췄을 때 시작 화면 표시
      if (!running) {
        ctx.fillStyle = 'rgba(0,0,0,0.45)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#fff';
        ctx.font = '30px sans-serif';
        ctx.fillText('시작', 205, 320);
      }
    }

    // 게임 루프: 계속 update와 draw를 반복
    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    // 키 입력 처리
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') keys.left = true;
      if (e.key === 'ArrowRight') keys.right = true;
    });

    document.addEventListener('keyup', (e) => {
      if (e.key === 'ArrowLeft') keys.left = false;
      if (e.key === 'ArrowRight') keys.right = false;
    });

    // 화면 클릭 시 게임 시작
    canvas.addEventListener('click', () => {
      running = true;
    });

    // 게임 처음 시작 준비
    makeBricks();
    resetBall();
    loop();
  </script>
</body>
</html>
